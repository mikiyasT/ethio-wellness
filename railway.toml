# API service. Set the Railway root directory to the repository root.
# Secrets: DATABASE_URL, DIRECT_URL, SESSION_SECRET, ADMIN_TOKEN, CORS_ORIGIN,
# COOKIE_SECURE=true, PUBLIC_WEB_URL=https://app.ayzoncare.com,
# CORS_ORIGIN=https://app.ayzoncare.com, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# RESEND_API_KEY, EMAIL_FROM, DAILY_API_KEY.
# Do not set ALLOW_DESTRUCTIVE_SEED. Web and API must both be HTTPS.
# Release step applies migrations through DIRECT_URL and does not seed.
# Start runs the same command again so a service that skips this file
# still creates tables before the reminder and hold sweepers query them.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build -w @ethio-wellness/api"

[deploy]
preDeployCommand = "npm run db:migrate -w @ethio-wellness/api"
startCommand = "npm run start -w @ethio-wellness/api"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
